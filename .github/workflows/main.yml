name: Windows-RDP-BORE

on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP FIXED
        shell: pwsh
        env:
          WIN_PASS: ${{ secrets.WIN_PASS }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_PASS)) {
            throw "The WIN_PASS secret is required."
          }
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP 3389" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP 3389 UDP" dir=in action=allow protocol=UDP localport=3389
          net user runneradmin "$env:WIN_PASS"
          net user runneradmin /active:yes
          net localgroup "Remote Desktop Users" runneradmin /add
          net localgroup "Administrators" runneradmin /add
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep 5
          netstat -an | findstr 3389
          Write-Host "RDP Ready for runneradmin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Copy CamSRV to C drive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $camSource = Join-Path $env:RUNNER_TEMP "CamSRV"
          if (Test-Path $camSource) {
            Remove-Item -Path $camSource -Recurse -Force
          }
          git clone --depth 1 --branch main https://github.com/Experian009/CamSRV.git $camSource

          $camRoot = "C:\CamSRV"
          if (Test-Path $camRoot) {
            Remove-Item -Path $camRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $camRoot -Force | Out-Null
          Remove-Item -Path (Join-Path $camSource ".git") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $camSource -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $camRoot -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $camRoot "v380_gui.py"))) {
            throw "CamSRV was not copied to $camRoot."
          }

          $uploaderDir = Join-Path $camRoot "terabox\app"
          npm ci --prefix $uploaderDir --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed in $uploaderDir with code $LASTEXITCODE."
          }
          if (-not (Test-Path (Join-Path $uploaderDir "node_modules\undici"))) {
            throw "TeraBox dependencies are missing in $uploaderDir."
          }

          Write-Host "CamSRV copied from $camSource to $camRoot. The program was not started."

      # ---------------------------------------------------------------------
      # Запуск v380_gui.py при входе пользователя.
      #
      # Отличия от прежнего шага:
      #   * Register-ScheduledTask + InteractiveToken вместо schtasks /it /rl highest.
      #     Комбинация /it с /rl highest конфликтует, а пароль в /rp виден в
      #     списке процессов. Здесь пароль вообще не нужен.
      #   * Обёртка вызывает v380_gui.py напрямую, а не start.bat: в start.bat
      #     последняя строка "if errorlevel 1 pause", и в невидимой сессии
      #     pause повесил бы процесс навсегда.
      #   * Задержка 30 секунд вместо 15: профиль при первом входе создаётся дольше.
      #   * Вывод пишется в C:\CamSRV\gui.log, иначе ошибку tkinter не увидеть.
      #   * FIX: если не найден ни py, ни python — в лог пишется ошибка,
      #     раньше обёртка молча завершалась.
      - name: Register CamSRV GUI on logon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $wrapper = "C:\CamSRV\start-camsrv.cmd"
          Set-Content -Path $wrapper -Encoding ASCII -Value @'
          @echo off
          setlocal
          cd /d C:\CamSRV
          ping -n 31 127.0.0.1 > nul
          if not exist ".env.windows" copy /y ".env.windows.example" ".env.windows" >nul
          where py >nul 2>nul
          if %errorlevel%==0 (
            py -3 v380_gui.py >> "C:\CamSRV\gui.log" 2>&1
          ) else (
            where python >nul 2>nul
            if %errorlevel%==0 (
              python v380_gui.py >> "C:\CamSRV\gui.log" 2>&1
            ) else (
              echo [ERROR] Python not found >> "C:\CamSRV\gui.log" 2>&1
            )
          )
          '@

          $xml = @"
          <?xml version="1.0" encoding="UTF-16"?>
          <Task version="1.4" xmlns="http://schemas.microsoft.com/windows/2004/02/mit/task">
            <RegistrationInfo>
              <Description>Запуск v380_gui.py после входа пользователя</Description>
            </RegistrationInfo>
            <Triggers>
              <LogonTrigger>
                <Enabled>true</Enabled>
                <UserId>runneradmin</UserId>
                <Delay>PT30S</Delay>
              </LogonTrigger>
            </Triggers>
            <Principals>
              <Principal id="Author">
                <UserId>runneradmin</UserId>
                <LogonType>InteractiveToken</LogonType>
                <RunLevel>HighestAvailable</RunLevel>
              </Principal>
            </Principals>
            <Settings>
              <MultipleInstancesPolicy>IgnoreNew</MultipleInstancesPolicy>
              <DisallowStartIfOnBatteries>false</DisallowStartIfOnBatteries>
              <StopIfGoingOnBatteries>false</StopIfGoingOnBatteries>
              <AllowHardTerminate>true</AllowHardTerminate>
              <StartWhenAvailable>true</StartWhenAvailable>
              <RunOnlyIfNetworkAvailable>false</RunOnlyIfNetworkAvailable>
              <AllowStartOnDemand>true</AllowStartOnDemand>
              <Enabled>true</Enabled>
              <Hidden>false</Hidden>
              <RunOnlyIfIdle>false</RunOnlyIfIdle>
              <WakeToRun>false</WakeToRun>
              <ExecutionTimeLimit>PT0S</ExecutionTimeLimit>
              <Priority>7</Priority>
            </Settings>
            <Actions Context="Author">
              <Exec>
                <Command>C:\CamSRV\start-camsrv.cmd</Command>
                <WorkingDirectory>C:\CamSRV</WorkingDirectory>
              </Exec>
            </Actions>
          </Task>
          "@

          Register-ScheduledTask -TaskName "StartCamSRV" -Xml $xml -Force | Out-Null
          Write-Host "Задача StartCamSRV зарегистрирована."
          Get-ScheduledTask -TaskName "StartCamSRV" | Select-Object TaskName, State | Format-Table -AutoSize

      - name: Install bore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Downloading bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip -UseBasicParsing
          Expand-Archive -Path bore.zip -DestinationPath .
          .\bore.exe --help

      # ---------------------------------------------------------------------
      # NEW: автоматический вход + перезагрузка.
      #
      # Задача StartCamSRV висит на триггере Logon, но сам по себе вход никто
      # не выполняет — раньше для этого нужно было вручную подключаться по RDP.
      # Здесь включается автологон runneradmin и VM перезагружается: после
      # перезагрузки Windows сам входит в систему и срабатывает задача.
      # Агент GitHub Actions переживает перезагрузку и продолжает job
      # со следующего шага — это штатный паттерн для Windows-раннеров.
      - name: Enable auto-login and reboot
        shell: pwsh
        env:
          WIN_PASS: ${{ secrets.WIN_PASS }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_PASS)) {
            throw "The WIN_PASS secret is required."
          }
          $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
          Set-ItemProperty -Path $reg -Name AutoAdminLogon -Value 1 -Type String -Force
          Set-ItemProperty -Path $reg -Name DefaultUserName -Value 'runneradmin' -Type String -Force
          Set-ItemProperty -Path $reg -Name DefaultPassword -Value $env:WIN_PASS -Type String -Force
          Set-ItemProperty -Path $reg -Name DefaultDomainName -Value $env:COMPUTERNAME -Type String -Force
          Write-Host "Auto-login enabled for runneradmin. Rebooting..."
          # Маркер времени: по нему следующий шаг проверит, что ребут реально был
          (Get-Date).ToString('o') | Out-File C:\reboot_marker.txt -Encoding ASCII -Force
          shutdown /r /t 10 /f

      # ---------------------------------------------------------------------
      # NEW: быстрая проверка, что перезагрузка действительно произошла.
      # Если ребута не было — падаем сразу с понятной ошибкой, а не висим
      # 4 минуты в ожидании процесса, который никогда не появится.
      - name: Confirm reboot and logon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $markerTime = [datetime]::Parse((Get-Content C:\reboot_marker.txt -ErrorAction Stop))
          $boot = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime
          Write-Host "Pre-reboot marker: $markerTime"
          Write-Host "LastBootUpTime:    $boot"
          if ($boot -lt $markerTime) {
            throw "REBOOT DID NOT HAPPEN. LastBootUpTime ($boot) раньше маркера ($markerTime). Автологон не выполнялся, задача StartCamSRV не могла сработать."
          }
          Write-Host "Reboot confirmed."
          Write-Host "--- logged on users ---"
          query user 2>&1 | Out-String | Write-Host

      # ---------------------------------------------------------------------
      # Проверка, что GUI действительно запустилась.
      # Ждём до 4 минут появления процесса python и смотрим хвост gui.log.
      # Раньше в логах workflow вообще не было видно, стартовала ли программа.
      - name: Verify CamSRV GUI started
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $taskInfo = Get-ScheduledTask -TaskName "StartCamSRV" | Get-ScheduledTaskInfo
          Write-Host "StartCamSRV LastRunTime: $($taskInfo.LastRunTime)"
          Write-Host "--- logged on users ---"
          query user 2>&1 | Out-String | Write-Host

          $deadline = (Get-Date).AddMinutes(4)
          $py = $null
          while ((Get-Date) -lt $deadline -and -not $py) {
            $py = Get-Process -Name "python" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $py) { Start-Sleep 15 }
          }
          if (-not $py) {
            Write-Host "--- gui.log tail ---"
            Get-Content "C:\CamSRV\gui.log" -Tail 30 -ErrorAction SilentlyContinue
            throw "python process not found — v380_gui.py did not start."
          }
          $py | Select-Object Name, Id, StartTime | Format-Table -AutoSize
          Write-Host "--- gui.log tail ---"
          Get-Content "C:\CamSRV\gui.log" -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "CamSRV GUI is running."

      - name: Start bore tunnel for RDP 3389
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pinned = "41414"

          function Start-Bore {
            param([string[]]$Extra = @())
            $a = @("local", "3389", "--to", "bore.pub") + $Extra
            Write-Host "starting: bore $($a -join ' ')"
            return Start-Process `
              -FilePath ".\bore.exe" `
              -ArgumentList $a `
              -NoNewWindow `
              -RedirectStandardOutput bore.log `
              -RedirectStandardError bore-err.log `
              -PassThru
          }

          function Get-BoreEndpoint {
            if (Test-Path bore.log) {
              $hits = Select-String -Path bore.log -Pattern 'listening at\s+([A-Za-z0-9._-]+):(\d+)'
              if ($hits) {
                $m = [regex]::Match($hits[-1].Line, 'listening at\s+([A-Za-z0-9._-]+):(\d+)')
                return "$($m.Groups[1].Value):$($m.Groups[2].Value)"
              }
            }
            return $null
          }

          $bore = Start-Bore -Extra @("--port", $pinned)
          Start-Sleep 20
          $bore.Refresh()
          if ($bore.HasExited) {
            Write-Host "Port $pinned is taken; retrying with a random port."
            Remove-Item bore.log, bore-err.log -ErrorAction SilentlyContinue
            $bore = Start-Bore
            Start-Sleep 20
            $bore.Refresh()
          }
          if ($bore.HasExited) {
            Get-Content bore-err.log -Tail 100 -ErrorAction SilentlyContinue
            throw "bore stopped with code $($bore.ExitCode)."
          }

          $endpoint = Get-BoreEndpoint
          if (-not $endpoint) {
            Get-Content bore.log -Tail 50 -ErrorAction SilentlyContinue
            Get-Content bore-err.log -Tail 100 -ErrorAction SilentlyContinue
            throw "Could not read the bore endpoint from the log."
          }

          Write-Host "=========================================="
          Write-Host "RDP_ENDPOINT=$endpoint"
          Write-Host "Адрес:  $endpoint"
          Write-Host "Логин:  runneradmin"
          Write-Host "Пароль: из WIN_PASS"
          Write-Host "=========================================="

          while ($true) {
            $bore.Refresh()
            if ($bore.HasExited) {
              Get-Content bore-err.log -Tail 100 -ErrorAction SilentlyContinue
              throw "bore stopped with code $($bore.ExitCode)."
            }
            Write-Host "[$(Get-Date)] bore alive, endpoint $endpoint"
            Start-Sleep 60
          }
          
