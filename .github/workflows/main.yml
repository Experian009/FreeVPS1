name: Windows-RDP-TAILSCALE-MANUAL
on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          net user runneradmin ${{ secrets.WIN_PASS }}
          net user runneradmin /active:yes
          Write-Host "RDP enabled for runneradmin"

      - name: Install Tailscale MSI
        shell: pwsh
        run: |
          $msi = "$env:TEMP\tailscale.msi"
          Write-Host "Downloading Tailscale..."
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi -UseBasicParsing
          Write-Host "Installing..."
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /qn" -Wait
          Start-Sleep 15
          $env:Path += ";C:\Program Files\Tailscale"
          "C:\Program Files\Tailscale" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "C:\Program Files\Tailscale\tailscale.exe" version

      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_AUTHKEY --hostname=gh-win-$env:GITHUB_RUN_ID --accept-routes
          Start-Sleep 5
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "=== Tailscale IP: $ip ==="
          & "C:\Program Files\Tailscale\tailscale.exe" status
          Write-Host "ГОТОВО! Подключайся по RDP к $ip логин runneradmin"

      - name: Keep alive
        shell: pwsh
        run: |
          while($true){
            $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
            Write-Host "[$(Get-Date)] IP $ip alive..."
            Start-Sleep 300
          }
