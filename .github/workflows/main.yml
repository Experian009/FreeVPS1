name: Windows-RDP-BORE


on: workflow_dispatch


jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP FIXED
        shell: pwsh
        env:
          WIN_PASS: ${{ secrets.WIN_PASS }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WIN_PASS)) {
            throw "The WIN_PASS secret is required."
          }
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP 3389" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP 3389 UDP" dir=in action=allow protocol=UDP localport=3389
          net user runneradmin "$env:WIN_PASS"
          net user runneradmin /active:yes
          net localgroup "Remote Desktop Users" runneradmin /add
          net localgroup "Administrators" runneradmin /add
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep 5
          netstat -an | findstr 3389
          Write-Host "RDP Ready for runneradmin"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"

      - name: Copy CamSRV to C drive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $camSource = Join-Path $env:RUNNER_TEMP "CamSRV"
          if (Test-Path $camSource) {
            Remove-Item -Path $camSource -Recurse -Force
          }
          git clone --depth 1 --branch main https://github.com/Experian009/CamSRV.git $camSource

          $camRoot = "C:\CamSRV"
          if (Test-Path $camRoot) {
            Remove-Item -Path $camRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Path $camRoot -Force | Out-Null
          Remove-Item -Path (Join-Path $camSource ".git") -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $camSource -Force | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $camRoot -Recurse -Force
          }
          foreach ($f in @("v380_event.py", "v380_gui.py")) {
            if (-not (Test-Path (Join-Path $camRoot $f))) {
              throw "CamSRV was not copied to $camRoot (missing $f)."
            }
          }

          $uploaderDir = Join-Path $camRoot "terabox\app"
          npm ci --prefix $uploaderDir --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed in $uploaderDir with code $LASTEXITCODE."
          }
          if (-not (Test-Path (Join-Path $uploaderDir "node_modules\undici"))) {
            throw "TeraBox dependencies are missing in $uploaderDir."
          }

          Write-Host "CamSRV copied from $camSource to $camRoot. The program was not started."
      - name: Install human-detection deps (if enabled)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $envFile = "C:\CamSRV\.env.windows"
          $enabled = $false
          if (Test-Path $envFile) {
            $enabled = Select-String -Path $envFile -Pattern "^HUMAN_DETECT=1" -Quiet
          }
          if (-not $enabled) {
            Write-Host "HUMAN_DETECT is not enabled in .env.windows - skipping ultralytics install."
            exit 0
          }
          $pyCmd = Get-Command python.exe -ErrorAction SilentlyContinue
          if (-not $pyCmd) { $pyCmd = Get-Command py.exe -ErrorAction SilentlyContinue }
          if (-not $pyCmd) { throw "Python not found on the runner." }
          $pyExe = $pyCmd.Source
          Write-Host "Installing CPU torch + ultralytics ..."
          & $pyExe -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          if ($LASTEXITCODE -ne 0) { throw "pip install torch (CPU) failed, code $LASTEXITCODE." }
          & $pyExe -m pip install --quiet ultralytics
          if ($LASTEXITCODE -ne 0) { throw "pip install ultralytics failed, code $LASTEXITCODE." }
          Write-Host "Human-detection dependencies installed."

      
      
      - name: Install bore
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "Downloading bore..."
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-pc-windows-msvc.zip" -OutFile bore.zip -UseBasicParsing
          Expand-Archive -Path bore.zip -DestinationPath .
          .\bore.exe --help

      # ---------------------------------------------------------------------
      # v3: запуск сервиса БЕЗ графического интерфейса.
      #
      # Разбор репозитория показал:
      #   * v380_event.py — это и есть весь сервис (камера, детектор движения,
      #     Telegram, TeraBox). Только стандартная библиотека Python, ни одного
      #     вызова GUI. Запуск вручную:  py V380_Event.py  (так в README).
      #   * v380_gui.py — лишь tkinter-обёртка:  from v380_event import Config,
      #     V380Service  — и запуск того же сервиса в отдельном потоке.
      # Вывод: видимый рабочий стол НЕ нужен. Весь автологон, перезагрузка
      # и вход по RDP были нужны только ради GUI-обёртки.
      #
      # Задача планируется от SYSTEM и стартует по требованию — вход
      # пользователя не требуется вообще. Перезагрузка раннера больше
      # не нужна (диагностика показала: shutdown /r на хостед-раннере
      # команду принимает, но Windows не перезагружается).
      #
      # Попутно исправлен путь: раньше задача указывала на
      # C:\CamSRV\terabox\app\v380_gui.py — такого файла в репозитории нет,
      # v380_gui.py и v380_event.py лежат в корне C:\CamSRV.
      - name: Register CamSRV headless service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyCmd = Get-Command python.exe -ErrorAction SilentlyContinue
          if (-not $pyCmd) { $pyCmd = Get-Command py.exe -ErrorAction SilentlyContinue }
          if (-not $pyCmd) { throw "Python not found on the runner." }
          $pyExe = $pyCmd.Source
          Write-Host "Using Python: $pyExe"
          & $pyExe --version

          $action = New-ScheduledTaskAction -Execute $pyExe `
            -Argument "C:\CamSRV\v380_event.py" `
            -WorkingDirectory "C:\CamSRV"
          $settings = New-ScheduledTaskSettingsSet `
            -AllowStartIfOnBatteries -DontStopIfGoingOnBatteries `
            -StartWhenAvailable `
            -RestartCount 3 -RestartInterval (New-TimeSpan -Minutes 1)
          Register-ScheduledTask -TaskName "CamSRVService" `
            -Action $action -User "SYSTEM" -RunLevel Highest `
            -Settings $settings -Force | Out-Null
          Write-Host "Task CamSRVService registered."
          Get-ScheduledTask -TaskName "CamSRVService" | Select-Object TaskName, State | Format-Table -AutoSize

      - name: Start CamSRV service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Start-ScheduledTask -TaskName "CamSRVService"
          Start-Sleep 10
          $task = Get-ScheduledTask -TaskName "CamSRVService"
          Write-Host "CamSRVService state: $($task.State)"
          if ($task.State -ne "Running") {
            throw "CamSRVService is not Running (state: $($task.State))."
          }

      # ---------------------------------------------------------------------
      # Проверка, что сервис действительно работает: процесс python жив,
      # в логе сервиса есть записи.
      - name: Verify CamSRV service running
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deadline = (Get-Date).AddMinutes(3)
          $py = $null
          while ((Get-Date) -lt $deadline -and -not $py) {
            $py = Get-Process -Name "python" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $py) { Start-Sleep 15 }
          }
          if (-not $py) {
            Write-Host "--- service.log tail ---"
            Get-Content "C:\CamSRV\data\logs\service.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "python process not found — v380_event.py did not start."
          }
          $py | Select-Object Name, Id, StartTime | Format-Table -AutoSize
          Write-Host "--- service.log tail ---"
          Get-Content "C:\CamSRV\data\logs\service.log" -Tail 40 -ErrorAction SilentlyContinue
          Write-Host "CamSRV service is running."

      - name: Start bore tunnel for RDP 3389
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pinned = "41414"

          function Start-Bore {
            param([string[]]$Extra = @())
            $a = @("local", "3389", "--to", "bore.pub") + $Extra
            Write-Host "starting: bore $($a -join ' ')"
            return Start-Process `
              -FilePath ".\bore.exe" `
              -ArgumentList $a `
              -NoNewWindow `
              -RedirectStandardOutput bore.log `
              -RedirectStandardError bore-err.log `
              -PassThru
          }

          function Get-BoreEndpoint {
            if (Test-Path bore.log) {
              $hits = Select-String -Path bore.log -Pattern 'listening at\s+([A-Za-z0-9._-]+):(\d+)'
              if ($hits) {
                $m = [regex]::Match($hits[-1].Line, 'listening at\s+([A-Za-z0-9._-]+):(\d+)')
                return "$($m.Groups[1].Value):$($m.Groups[2].Value)"
              }
            }
            return $null
          }

          $bore = Start-Bore -Extra @("--port", $pinned)
          Start-Sleep 20
          $bore.Refresh()
          if ($bore.HasExited) {
            Write-Host "Port $pinned is taken; retrying with a random port."
            Remove-Item bore.log, bore-err.log -ErrorAction SilentlyContinue
            $bore = Start-Bore
            Start-Sleep 20
            $bore.Refresh()
          }
          if ($bore.HasExited) {
            Get-Content bore-err.log -Tail 100 -ErrorAction SilentlyContinue
            throw "bore stopped with code $($bore.ExitCode)."
          }

          $endpoint = Get-BoreEndpoint
          if (-not $endpoint) {
            Get-Content bore.log -Tail 50 -ErrorAction SilentlyContinue
            Get-Content bore-err.log -Tail 100 -ErrorAction SilentlyContinue
            throw "Could not read the bore endpoint from the log."
          }

          Write-Host "=========================================="
          Write-Host "RDP_ENDPOINT=$endpoint"
          Write-Host "Адрес:  $endpoint"
          Write-Host "Логин:  runneradmin"
          Write-Host "Пароль: из WIN_PASS"
          Write-Host "=========================================="

          # Watchdog: bore.pub sometimes closes the connection (bore then exits,
          # even with code 0). The tunnel is auxiliary — never fail the whole job
          # over it. Restart bore and keep the VM alive for the full 6 hours.
          $restarts = 0
          while ($true) {
            $bore.Refresh()
            if ($bore.HasExited) {
              $restarts++
              $code = $bore.ExitCode
              Write-Host "[$(Get-Date)] bore exited with code $code (restart #$restarts). Last error lines:"
              Get-Content bore-err.log -Tail 20 -ErrorAction SilentlyContinue
              Write-Host "Restarting bore in 10s (random port)..."
              Start-Sleep 10
              Remove-Item bore.log, bore-err.log -ErrorAction SilentlyContinue
              $bore = Start-Bore
              Start-Sleep 20
              $bore.Refresh()
              if ($bore.HasExited) {
                Write-Host "WARNING: bore failed to restart (code $($bore.ExitCode)); retrying in 60s."
                Start-Sleep 60
                continue
              }
              $endpoint = Get-BoreEndpoint
              Write-Host "=========================================="
              Write-Host "RDP_ENDPOINT=$endpoint (reconnect #$restarts)"
              Write-Host "Адрес:  $endpoint"
              Write-Host "Логин:  runneradmin"
              Write-Host "Пароль: из WIN_PASS"
              Write-Host "=========================================="
              continue
            }
            Write-Host "[$(Get-Date)] bore alive, endpoint $endpoint"
            Start-Sleep 60
          }
