name: Windows-RDP-PLAYIT
on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP FIXED
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" -Name "UserAuthentication" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          netsh advfirewall firewall add rule name="RDP 3389" dir=in action=allow protocol=TCP localport=3389
          netsh advfirewall firewall add rule name="RDP 3389 UDP" dir=in action=allow protocol=UDP localport=3389
          net user runneradmin ${{ secrets.WIN_PASS }}
          net user runneradmin /active:yes
          net localgroup "Remote Desktop Users" runneradmin /add
          net localgroup "Administrators" runneradmin /add
          Restart-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep 5
          netstat -an | findstr 3389
          Write-Host "RDP Ready for runneradmin"

      - name: Install playit.gg
        shell: pwsh
        run: |
          Write-Host "Downloading playit.gg..."
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-windows-x86_64-signed.exe" -OutFile playit.exe -UseBasicParsing
          .\playit.exe --version

      - name: Start playit tunnel for RDP 3389
        shell: pwsh
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          Write-Host "Starting playit.gg agent..."
          # Запускаем агента с твоим секретом
          Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret $env:PLAYIT_SECRET" -NoNewWindow -RedirectStandardOutput playit.log -RedirectStandardError playit-err.log
          Start-Sleep 15
          Write-Host "--- playit log ---"
          Get-Content playit.log -Tail 100
          Get-Content playit-err.log -Tail 50 -ErrorAction SilentlyContinue
          Write-Host "=========================================="
          Write-Host "Зайди на https://playit.gg/account/tunnels"
          Write-Host "Там появится твой туннель вида: random.playit.gg:12345"
          Write-Host "Это и есть твой RDP адрес!"
          Write-Host "Логин: runneradmin"
          Write-Host "Пароль: из WIN_PASS"
          Write-Host "В mstsc вводи адрес из панели playit.gg"
          Write-Host "=========================================="
          while($true){
            Write-Host "[$(Get-Date)] playit alive, check playit.gg panel for address"
            Get-Content playit.log -Tail 5 -ErrorAction SilentlyContinue
            Start-Sleep 60
          }
