name: Windows-RDP-Upterm-FIXED
on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          net user runneradmin ${{ secrets.WIN_PASS }}
          net user runneradmin /active:yes

      - name: Create Upterm session (RDP is inside it)
        uses: lhotari/action-upterm@v1
        with:
          limit-access-to-actor: false
          # limit-access-to-users: твой_гитхаб_ник

      - name: Keep alive
        run: |
          while($true){
            Write-Host "Running... $(Get-Date)"
            Start-Sleep 300
          }
