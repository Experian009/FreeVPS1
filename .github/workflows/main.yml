name: Free Ubuntu VPS - без карты
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Запуск VPS
        run: |
          sudo apt update
          sudo apt install -y tmate
          echo "=== ЖДЕМ ССЫЛКУ ==="
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          echo ""
          echo "=== КОПИРУЙ ЭТИ 2 СТРОКИ ==="
          tmate -S /tmp/tmate.sock display -p 'SSH: #{tmate_ssh}'
          tmate -S /tmp/tmate.sock display -p 'WEB: #{tmate_web}   <- открой в браузере'
          echo ""
          echo "Комп будет жить 6 часов"
          sleep 21600
