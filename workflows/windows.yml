name: Windows-RDP-UPTERM-MANUAL
on: workflow_dispatch

jobs:
  win:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          Set-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue
          net user runneradmin ${{ secrets.WIN_PASS }}
          net user runneradmin /active:yes
          Write-Host "RDP enabled for runneradmin"

      - name: Install upterm via scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
          Invoke-Expression (New-Object System.Net.WebClient).DownloadString('https://get.scoop.sh')
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add upterm https://github.com/owenthereal/scoop-upterm
          scoop install upterm
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          upterm --help

      - name: Start upterm host with RDP forwarding
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          Write-Host "Starting upterm host..."
          upterm host --server ssh://uptermd.upterm.dev:22 --allow-local-tcp-forwarding -- powershell
